name: "Factory: Issue Triage Line 1"
on:
  issues:
    types:
      - opened
concurrency:
  group: factory--issue-triage-line-1-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  line:
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.user.type != 'Bot' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙ agent.claude (a1)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |-
            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}

            Read and follow the operating instructions in .factory/prompts/triage.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.label s1] Apply the appropriate labels to issue #${{ github.event.issue.number }} using `gh issue edit --add-label`. Prefer existing labels (`gh label list`).
            2. [sink.comment s2] Post exactly one comment on issue #${{ github.event.issue.number }} that summarizes the triage decision in 3 lines and links any duplicates.
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 8
            --allowedTools "Bash(gh issue view:*),Bash(gh search issues:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"

