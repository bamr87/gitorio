<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23020617'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2322d3ee'/%3E%3C/svg%3E"
    />
    <title>GitFactory — factory builder for GitHub automation</title>
    <!-- Head/meta block (UPS-FE-25). Absolute URLs: the Vite base differs between a local build

    <meta
      name="description"
      content="Factorio-style factory builder: blueprints compile to GitHub Actions workflows running Claude Code."
    />
    <link rel="canonical" href="https://bamr87.github.io/gitorio/" />
    <meta name="theme-color" content="#020617" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitFactory" />
    <meta property="og:title" content="GitFactory — factory builder for GitHub automation" />
    <meta
      property="og:description"
      content="Factorio-style factory builder: blueprints compile to GitHub Actions workflows running Claude Code."
    />
    <meta property="og:url" content="https://bamr87.github.io/gitorio/" />
    <meta name="twitter:card" content="summary" />
    <!-- Feedback capture buffer (UPS-FB-04): first so it sees load-time errors. -->
    <script src="/fleet-feedback-capture.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Universal "Improve this page" widget (UPS-FB-01 / UPS-FE-13). Default `url` mode: it opens a
         prefilled GitHub issue in a new tab and makes no request of its own. -->
    <script src="/fleet-feedback.js" defer></script>
    <fleet-feedback repo="bamr87/gitorio" branch="main" source="app/src/App.tsx" app-version="gitorio"></fleet-feedback>
  </body>
