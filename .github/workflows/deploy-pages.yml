name: Deploy to GitHub Pages
# Gate: a push to main no longer deploys directly — Pages deploys only after the
# "CI" workflow completes successfully on main (workflow_run + conclusion check
# on the build job). workflow_dispatch remains a manual path and is not blocked
# by the CI-success condition.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only when CI succeeded; manual dispatch runs are never blocked.
    # (deploy inherits the gate via `needs: build` — a skipped build skips deploy.)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out main's current head by default; pin to the
          # exact SHA CI validated. Empty on dispatch → falls back to github.sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
