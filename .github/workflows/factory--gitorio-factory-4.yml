name: "Factory: Gitorio Factory 4"
on:
  pull_request:
    types:
      - labeled
concurrency:
  group: factory--gitorio-factory-4-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.number || github.run_id }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.DEPENDENCY_MERGE_ENABLED }}
        run: |-
          if [ "$ENABLED" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate closed — set the 'DEPENDENCY_MERGE_ENABLED' variable to true to arm this line."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  line:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' && github.event.label.name == 'dep:merge-approved' && github.event.sender.type != 'Bot' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ✅ sink.merge_pr (mm)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.number }}
        run: gh pr merge "$NUMBER" --squash --auto
