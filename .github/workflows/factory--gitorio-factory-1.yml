name: "Factory: Gitorio Factory 1"
on:
  issues:
    types:
      - opened
concurrency:
  group: factory--gitorio-factory-1-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  line:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: ⚙ agent.claude (a1)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}

            Read and follow the operating instructions in .factory/prompts/triage.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.label s1] Apply the appropriate labels to issue #${{ github.event.issue.number }} using `gh issue edit --add-label`. Prefer existing labels (`gh label list`).
            2. [sink.comment s2] Post exactly one comment on issue #${{ github.event.issue.number }} that summarizes the triage decision in 3 lines and links any duplicates.
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 8
            --allowedTools "Bash(gh issue view:*),Bash(gh search issues:*),Read,Glob,Grep,Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
