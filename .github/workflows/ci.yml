name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # AO-SDLC gates (golden rule #11, ADR-022): spec drift + backlog format/append-only.
  # In CI the checked-out worktree IS HEAD, so the append-only diff must run
  # against the parent: BACKLOG_LINT_BASE=HEAD^1 (previous commit on push; the
  # base-branch tip on a PR merge commit). fetch-depth: 2 makes HEAD^1 available.
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 tools/spec_validator.py
      - run: python3 tools/backlog_lint.py
        env:
          BACKLOG_LINT_BASE: HEAD^1

  # Archify maps (ADR-034, specs/010): the committed maps under app/public/maps must be
  # exactly what the pure IR compiler + the VENDORED archify renderer produce (golden
  # rule #2), and every IR must pass archify's showcase gate. No network, no secrets.
  diagram-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run maps:check
      - name: showcase-validate every committed IR
        run: |
          set -e
          for f in public/maps/*.workflow.json; do node ../vendor/archify/bin/archify.mjs validate workflow "$f" --quality showcase --json > /dev/null; done
          for f in public/maps/*.architecture.json; do node ../vendor/archify/bin/archify.mjs validate architecture "$f" --quality showcase --json > /dev/null; done
