name: "Factory: Gitorio Factory 3"
on:
  workflow_dispatch: {}
  schedule:
    - cron: 23 6 * * 1
concurrency:
  group: factory--gitorio-factory-3-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.number || github.run_id }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.DEPENDENCY_WARDEN_ENABLED }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |-
          if [ "$ENABLED" = "true" ] && { [ -n "$OAUTH" ] || [ -n "$KEY" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate closed — set the 'DEPENDENCY_WARDEN_ENABLED' variable to true and provision Claude auth to arm this line."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  line:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: 🚥 rate.limiter (wr)
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: "3"
        run: |-
          COUNT=$(gh run list --workflow "$GITHUB_WORKFLOW" --created "$(date -u +%Y-%m-%d)" --json databaseId --jq 'length')
          if [ "$COUNT" -ge "$LIMIT" ]; then echo "rate limit ($LIMIT/day) reached — stopping"; exit 1; fi
      - uses: actions/checkout@v7
      - name: ⚙ agent.claude (wa)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}

            Read and follow the operating instructions in .factory/prompts/dependency-warden.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.comment ws1] Post exactly one comment on the relevant issue/PR (find it via gh) that records the dependency's merge-risk verdict — bump size, breaking-change check, and a merge recommendation — in ~4 lines.
            2. [sink.label ws2] Apply the appropriate labels to the relevant issue/PR (find it via gh) using `gh issue edit --add-label`. Prefer existing labels (`gh label list`).
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Glob,Grep,Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh pr edit:*)"
