name: "Factory: Gitorio Factory 3"
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 6 * * 1
concurrency:
  group: factory--gitorio-factory-3-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  line:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙ agent.claude (wa)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}

            Read and follow the operating instructions in .factory/prompts/dependency-warden.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.comment ws1] Post exactly one comment on the relevant issue/PR (find it via gh) that records the dependency's merge-risk verdict — bump size, breaking-change check, and a merge recommendation — in ~4 lines.
            2. [sink.label ws2] Apply the appropriate labels to the relevant issue/PR (find it via gh) using `gh issue edit --add-label`. Prefer existing labels (`gh label list`).
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh pr edit:*)"
