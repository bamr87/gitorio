name: "Factory: Gitorio Factory 2"
on:
  # Schedule paused (Actions waste reduction, Oct 14): Actions jobs in this private repo are refused
  # by the billing block ("recent account payments have failed or your spending limit needs to be
  # increased"), bamr87/bamr87#268, so every scheduled run failed without running.
  # To restore once billing is fixed: uncomment the schedule block below (workflow_dispatch still works).
  # schedule:
  #   - cron: 17 3 * * *
  workflow_dispatch:  # added so the workflow can still be run by hand while the schedule is paused
concurrency:
  group: factory--gitorio-factory-2-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.number || github.run_id }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.NIGHTLY_GARDENER_ENABLED }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |-
          if [ "$ENABLED" = "true" ] && { [ -n "$OAUTH" ] || [ -n "$KEY" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate closed — set the 'NIGHTLY_GARDENER_ENABLED' variable to true and provision Claude auth to arm this line."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  line:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: 🚥 rate.limiter (r2)
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: "2"
        run: |-
          COUNT=$(gh run list --workflow "$GITHUB_WORKFLOW" --created "$(date -u +%Y-%m-%d)" --json databaseId --jq 'length')
          if [ "$COUNT" -ge "$LIMIT" ]; then echo "rate limit ($LIMIT/day) reached — stopping"; exit 1; fi
      - uses: actions/checkout@v7
      - name: ⚙ agent.claude (a2)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}

            Read and follow the operating instructions in .factory/prompts/nightly-gardener.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.comment s3] Post exactly one comment on the relevant issue/PR (find it via gh) that posts a gentle stale-issue nudge on each issue inactive for 30+ days (max 5 per night).
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 24
            --allowedTools "Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Glob,Grep,Bash(gh issue comment:*),Bash(gh pr comment:*)"
