name: "Factory: Gitorio Factory 2"
on:
  schedule:
    - cron: 0 3 * * *
concurrency:
  group: factory--gitorio-factory-2-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.number || github.run_id }}
  cancel-in-progress: false
jobs:
  line:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: ⚙ agent.claude (a2)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |-
            REPO: ${{ github.repository }}

            Read and follow the operating instructions in .factory/prompts/nightly-gardener.md.

            OBLIGATIONS (complete every item, nothing else):
            1. [sink.comment s3] Post exactly one comment on the relevant issue/PR (find it via gh) that posts a gentle stale-issue nudge on each issue inactive for 30+ days (max 5 per night).
          claude_args: |-
            --model claude-sonnet-4-6
            --max-turns 12
            --allowedTools "Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Glob,Grep,Bash(gh issue comment:*),Bash(gh pr comment:*)"
