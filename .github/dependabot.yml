# Dependabot configuration
#
# Keeps GitHub Actions up to date. Actions in this repository are referenced by
# commit SHA for supply-chain safety; Dependabot updates both the pinned SHA and
# the trailing `# vX.Y.Z` comment on the `uses:` line, so pinning stays a living
# practice rather than a one-time freeze.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # For the github-actions ecosystem, `directory: "/"` means the repository
  # root; Dependabot scans every workflow under .github/workflows/ from there.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Bundle all action bumps into a single PR per run so one review and one CI
    # cycle covers the whole sweep.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
