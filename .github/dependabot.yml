version: 2
updates:
  # Frontend npm dependencies (the app lives in /app).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk updates so review stays cheap.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflows GitFactory itself ships (CI + Pages).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
